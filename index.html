<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganwa Player | Pro Max</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --green: #1db954; --black: #121212; }
        body { background: #000; color: white; font-family: sans-serif; margin: 0; padding-bottom: 200px; }
        .container { max-width: 500px; margin: auto; padding: 20px; }
        .card { background: var(--black); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #282828; }
        select, input { width: 100%; padding: 12px; margin: 5px 0; background: #282828; color: #fff; border: none; border-radius: 8px; box-sizing: border-box; }
        .btn-add { background: var(--green); color: #000; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 25px; cursor: pointer; margin-top: 10px; }
        .song-item { display: flex; justify-content: space-between; align-items: center; background: #181818; padding: 15px; margin-bottom: 10px; border-radius: 10px; border-left: 5px solid var(--green); }
        .song-info { flex: 1; cursor: pointer; }
        .del-btn { background: none; border: none; color: #ff4444; font-size: 20px; cursor: pointer; padding-left: 10px; }
        footer { position: fixed; bottom: 0; width: 100%; background: rgba(18,18,18,0.98); border-top: 2px solid var(--green); padding: 20px; box-sizing: border-box; text-align: center; }
        #status { color: var(--green); font-weight: bold; margin-bottom: 10px; font-size: 14px; display: block; }
        audio { width: 100%; filter: invert(100%) hue-rotate(90deg); height: 40px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: var(--green); text-align: center;">🎶 Ganwa Player</h1>

    <div class="card">
        <select id="playlistSelect" onchange="loadSongs()"><option value="ALL">✨ All Playlists</option></select>
    </div>

    <div class="card">
        <input type="text" id="songName" placeholder="Song Name">
        <input type="text" id="songUrl" placeholder="Google Drive Link">
        <button class="btn-add" onclick="addSong()">➕ ADD SONG</button>
    </div>

    <div id="songsList"></div>
</div>

<footer>
    <span id="status">Select a song...</span>
    <audio id="mainAudio" controls autoplay></audio>
    <div style="margin-top: 10px;">
        <button onclick="playNext()" style="background:none; border:1px solid var(--green); color:white; padding:5px 20px; border-radius:20px; cursor:pointer;">NEXT ⏭️</button>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
