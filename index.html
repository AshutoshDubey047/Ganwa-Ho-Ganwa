<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganwa Player | Final Version</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body style="background: #000; color: white; font-family: sans-serif; margin: 0;">

    <div class="container" style="padding: 20px; padding-bottom: 200px; max-width: 600px; margin: auto;">
        <header style="text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px;">
            <h1 style="color: #1db954;">🎶 Ganwa-Ho-Ganwa</h1>
        </header>

        <div style="background: #181818; padding: 15px; border-radius: 10px; margin-top: 20px;">
            <label>Select Playlist:</label>
            <select id="playlistSelect" onchange="onPlaylistChange()" style="width: 100%; padding: 10px; margin-top: 10px; background: #333; color: white; border: none; border-radius: 5px;">
                <option value="ALL_SONGS">✨ All Songs</option>
            </select>
            <button onclick="deleteFullPlaylist()" style="width: 100%; background: #ff4444; border: none; color: white; padding: 8px; margin-top: 10px; border-radius: 5px; cursor: pointer;">🗑️ Delete Playlist</button>
        </div>

        <div style="background: #181818; padding: 15px; border-radius: 10px; margin-top: 20px;">
            <input type="text" id="songName" placeholder="Song Name" style="width: 93%; padding: 10px; margin-bottom: 10px; background: #333; border: none; color: white; border-radius: 5px;">
            <input type="text" id="songUrl" placeholder="Google Drive Link" style="width: 93%; padding: 10px; margin-bottom: 10px; background: #333; border: none; color: white; border-radius: 5px;">
            <button onclick="addSong()" style="width: 100%; background: #1db954; border: none; padding: 12px; font-weight: bold; border-radius: 5px; cursor: pointer;">➕ Add Song</button>
        </div>

        <div id="playlist" style="margin-top: 20px;"></div>
    </div>

    <footer style="position: fixed; bottom: 0; left: 0; width: 100%; background: #121212; border-top: 3px solid #1db954; padding: 20px; box-sizing: border-box; text-align: center;">
        <p id="playing-now" style="color: #1db954; font-weight: bold; margin-bottom: 10px;">Select a Song</p>
        
        <audio id="mainAudio" controls autoplay onended="playNextSong()" onerror="handleAudioError()" style="width: 100%; filter: invert(100%);">
            Your browser does not support audio.
        </audio>
        
        <div style="margin-top: 10px; display: flex; justify-content: center; gap: 20px;">
            <button onclick="playNextSong()" style="background: #333; color: white; border: 1px solid #1db954; padding: 10px 20px; border-radius: 20px; cursor: pointer;">Next Song ⏭️</button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
