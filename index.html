<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganwa-Ho-Ganwa Ultra Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎶 Ganwa-Ho-Ganwa</h1>
        </header>

        <div class="input-card">
            <h3>📁 Playlists</h3>
            <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                <input type="text" id="newPlaylistInput" placeholder="Create New Playlist...">
                <button onclick="createNewPlaylist()" style="background:#fb8c00; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">Create</button>
            </div>
            
            <label style="font-size: 12px; color: #888;">Switch View / Add Target:</label>
            <select id="playlistSelect" onchange="onPlaylistChange()" style="width: 100%; padding: 12px; background: #282828; color: white; border-radius: 8px; border: 1px solid #444; margin-top: 5px;">
                </select>

            <button onclick="deleteFullPlaylist()" style="background: #ff4444; color: white; margin-top: 10px; width: 100%; font-size: 12px; padding: 10px; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">
                🗑️ Delete Selected Playlist
            </button>
        </div>

        <div class="input-card">
            <h3>➕ Add Song</h3>
            <p style="font-size: 12px; color: #1db954;">Target Folder: <b id="targetDisplayName">All Songs</b></p>
            <input type="text" id="songName" placeholder="Song Name">
            <input type="text" id="songUrl" placeholder="Google Drive Link">
            <button onclick="addSong()" style="background: #1db954; color: black; width: 100%; margin-top: 10px; font-weight: bold; border-radius:5px; border:none; padding:12px; cursor:pointer;">Add Song</button>
        </div>

        <div class="playlist-section">
            <ul id="playlist"></ul>
        </div>

        <footer class="player-footer" style="position: fixed; bottom: 0; left: 0; width: 100%; background: #000; padding: 10px; border-top: 2px solid #1db954; text-align: center; z-index: 100;">
            <p id="playing-now" style="color: #1db954; margin: 0 0 5px 0; font-weight: bold;">Select a song</p>
            <div id="drive-player-wrapper"></div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
