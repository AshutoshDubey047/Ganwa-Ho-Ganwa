<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganwa-Ho-Ganwa Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <h1>🎶 Ganwa-Ho-Ganwa</h1>

        <div class="input-card">
            <h3>Create/Switch Playlist</h3>
            <input type="text" id="newPlaylistName" placeholder="Playlist ka naam (e.g. Party, Sad)...">
            <button onclick="switchPlaylist()">Switch/Create</button>
            <p>Current Playlist: <b id="currentPName">Default</b></p>
        </div>

        <div class="input-card">
            <h3>Add Song to <span id="targetPName">Default</span></h3>
            <input type="text" id="songName" placeholder="Gaane ka naam...">
            <input type="text" id="songUrl" placeholder="Google Drive Link...">
            <button onclick="addSong()" style="background: #1db954;">Add Song</button>
        </div>

        <ul id="playlistDisplay"></ul>

        <div id="player-container" class="player">
            <p id="playing-now">Select a song</p>
            <div id="drive-frame-wrapper">
                <p style="font-size: 12px; color: #888;">Note: Click the play icon on the player below</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
