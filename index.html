<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganwa Player FIX</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --green: #1db954; --black: #121212; }
        body { background: #000; color: white; font-family: sans-serif; margin: 0; padding-bottom: 220px; overflow-x: hidden; }
        .container { max-width: 500px; margin: auto; padding: 15px; }
        .card { background: var(--black); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #282828; }
        input, select { width: 100%; padding: 12px; margin: 5px 0; background: #282828; color: #fff; border: none; border-radius: 8px; box-sizing: border-box; }
        .btn-add { background: var(--green); color: #000; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 25px; cursor: pointer; }
        
        /* SONG LIST */
        .song-item { display: flex; justify-content: space-between; align-items: center; background: #181818; padding: 15px; margin-bottom: 10px; border-radius: 10px; border-left: 5px solid var(--green); }
        .song-info { flex: 1; cursor: pointer; }
        .del-btn { background: #ff4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 10px; font-size: 11px; }

        /* FOOTER PLAYER */
        footer { position: fixed; bottom: 0; width: 100%; background: #080808; border-top: 2px solid var(--green); padding: 15px; box-sizing: border-box; text-align: center; z-index: 1000; }
        #status { color: var(--green); font-weight: bold; font-size: 14px; margin-bottom: 10px; display: block; }
        #player-box { height: 85px; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: var(--green); text-align: center;">🎶 Ganwa Player Pro</h1>

    <div class="card">
        <select id="playlistSelect" onchange="renderSongs()"><option value="ALL">✨ All Playlists</option></select>
    </div>

    <div class="card">
        <input type="text" id="songName" placeholder="Song Name">
        <input type="text" id="songUrl" placeholder="Google Drive Link">
        <button class="btn-add" onclick="addSong()">➕ ADD SONG</button>
    </div>

    <div id="songsList"></div>
</div>

<footer>
    <span id="status">Select a song to start</span>
    <div id="player-box">
        <div style="padding-top:30px; color:#444;">Ready</div>
    </div>
    <div style="margin-top:10px;">
        <button onclick="playNext()" style="background:none; border:1px solid var(--green); color:white; padding:6px 20px; border-radius:20px; cursor:pointer; font-weight:bold;">NEXT ⏭️</button>
    </div>
</footer>

<script>
    // 1. CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyDr18ZsJyhqzI0fKw6Ix3iex3FfYhPAywU",
        authDomain: "ganwaplayer.firebaseapp.com",
        databaseURL: "https://ganwaplayer-default-rtdb.firebaseio.com",
        projectId: "ganwaplayer",
        storageBucket: "ganwaplayer.firebasestorage.app",
        messagingSenderId: "28027251724",
        appId: "1:28027251724:web:792638e52fd8d842671229"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentQueue = [];
    let currentIndex = -1;
    let masterData = {};

    // 2. DATA SYNC
    db.ref('collections').on('value', (snap) => {
        masterData = snap.val();
        if(!masterData) return;
        
        const select = document.getElementById('playlistSelect');
        const currentP = select.value || "ALL";
        let opts = '<option value="ALL">✨ All Playlists</option>';
        Object.keys(masterData).forEach(p => { if(p !== "_init") opts += `<option value="${p}">${p}</option>`; });
        select.innerHTML = opts;
        select.value = currentP;

        renderSongs();
    });

    function renderSongs() {
        const selP = document.getElementById('playlistSelect').value;
        const list = document.getElementById('songsList');
        list.innerHTML = "";
        currentQueue = [];

        for (let p in masterData) {
            if (selP !== "ALL" && p !== selP) continue;
            for (let id in masterData[p]) {
                if (id === "_init") continue;
                currentQueue.push({ ...masterData[p][id], pName: p, id: id });
                let idx = currentQueue.length - 1;
                list.innerHTML += `
                    <div class="song-item">
                        <div class="song-info" onclick="playSong(${idx})">
                            <b>${masterData[p][id].name}</b><br><small>${p}</small>
                        </div>
                        <button class="del-btn" onclick="deleteSong3X('${p}','${id}','${masterData[p][id].name}')">DEL</button>
                    </div>`;
            }
        }
    }

    // 3. PLAY LOGIC (100% SUNAI DEGA)
    function playSong(idx) {
        if(idx < 0 || idx >= currentQueue.length) return;
        currentIndex = idx;
        const song = currentQueue[idx];
        const fileId = song.url.match(/[-\w]{25,}/);

        if (fileId) {
            document.getElementById('status').innerText = "▶ Playing: " + song.name;
            // IFRAME is for the sound
            document.getElementById('player-box').innerHTML = 
                `<iframe id="musicFrame" src="https://drive.google.com/file/d/${fileId[0]}/preview" width="100%" height="80" style="border:none;" allow="autoplay"></iframe>`;
            
            // JUGAD: Google Iframe auto-next nahi deta, toh hum 4.5 min ka safety timer lagate hain
            // Agar aapko gaana skip karna hai toh NEXT button hai hi.
            clearTimeout(window.autoNextTimeout);
            window.autoNextTimeout = setTimeout(() => {
                playNext();
            }, 270000); // 4.5 Minutes (Average song length)
        }
    }

    function playNext() {
        let next = currentIndex + 1;
        if(next < currentQueue.length) playSong(next);
        else alert("Playlist Finished!");
    }

    // 4. 3-TIMES DELETE (As asked)
    function deleteSong3X(p, id, name) {
        if(confirm("⚠️ STEP 1: Delete '" + name + "'?")) {
            if(confirm("🛑 STEP 2: Pakka delete kar doon?")) {
                if(confirm("❗ STEP 3: Last chance, delete?")) {
                    db.ref(`collections/${p}/${id}`).remove();
                }
            }
        }
    }

    function addSong() {
        const n = document.getElementById('songName').value;
        const u = document.getElementById('songUrl').value;
        const p = document.getElementById('playlistSelect').value === "ALL" ? "Default" : document.getElementById('playlistSelect').value;
        if(n && u) {
            db.ref(`collections/${p}`).push({ name: n, url: u });
            document.getElementById('songName').value = "";
            document.getElementById('songUrl').value = "";
        }
    }
</script>
</body>
</html>
