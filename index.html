<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganwa Player Fixed</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: Arial; margin: 0; padding: 20px; padding-bottom: 180px; }
        .card { background: #181818; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        input { width: 90%; padding: 10px; margin: 5px 0; background: #282828; color: #fff; border: none; border-radius: 5px; }
        button { cursor: pointer; font-weight: bold; border-radius: 5px; border: none; }
        .add-btn { width: 100%; background: #1db954; padding: 12px; margin-top: 10px; }
        .song-item { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 12px; margin: 8px 0; border-radius: 8px; border-left: 4px solid #1db954; }
        .del-btn { background: #ff4444; color: white; padding: 8px 12px; }
        footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; border-top: 2px solid #1db954; padding: 15px; text-align: center; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: #1db954;">🎶 My Cloud Player</h1>

    <div class="card">
        <h3>Add New Song</h3>
        <input type="text" id="songName" placeholder="Song Name">
        <input type="text" id="songUrl" placeholder="Google Drive Link">
        <button class="add-btn" onclick="addSong()">ADD SONG</button>
    </div>

    <div id="song-list-container">
        <p style="text-align: center; color: #666;">Loading songs...</p>
    </div>

    <footer>
        <p id="now-playing" style="margin: 0 0 10px 0; color: #1db954; font-weight: bold;">Select a song</p>
        <div id="player-ui">
            <div style="height: 60px; background: #222; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #444;">Player Ready</div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
