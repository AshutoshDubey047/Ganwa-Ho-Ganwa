<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganwa-Ho-Ganwa Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <h1>🎶 Ganwa-Ho-Ganwa Pro</h1>

        <div class="input-card">
            <h3>📁 Manage Playlists</h3>
            <div style="display:flex; gap:10px;">
                <input type="text" id="newPlaylistName" placeholder="Playlist Name...">
                <button onclick="switchPlaylist()">Switch</button>
            </div>
            <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
                <p>Current: <b id="currentPName" style="color:#1db954;">Default</b></p>
                <button onclick="deleteFullPlaylist()" style="background:#ff4444; font-size:12px;">🗑️ Delete This Playlist</button>
            </div>
        </div>

        <div class="input-card">
            <h3>➕ Add Song</h3>
            <input type="text" id="songName" placeholder="Song Name">
            <input type="text" id="songUrl" placeholder="Google Drive Link">
            <button onclick="addSong()" style="background:#1db954; width:100%; margin-top:10px;">Add to List</button>
        </div>

        <div class="playlist-section">
            <ul id="playlist"></ul>
        </div>

        <div class="player-footer">
            <p id="playing-now">Select a song</p>
            <div id="drive-player-wrapper"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
