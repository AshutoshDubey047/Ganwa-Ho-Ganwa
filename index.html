<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganwa Player | Auto-Next Edition</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body style="background:#000; color:#fff; font-family:sans-serif; margin:0; padding-bottom:180px;">

    <div class="container" style="max-width:550px; margin:auto; padding:20px;">
        <header style="text-align:center; padding:10px 0;">
            <h1 style="color:#1db954; margin:0;">🎶 Ganwa Player</h1>
            <p id="timer-display" style="font-size:10px; color:#444;">Auto-Next Ready</p>
        </header>

        <div style="background:#181818; padding:15px; border-radius:12px; margin-bottom:15px; border:1px solid #333;">
            <select id="playlistSelect" onchange="onPlaylistChange()" style="width:100%; padding:12px; background:#282828; color:#fff; border:none; border-radius:8px;">
                <option value="ALL_SONGS">✨ All Songs</option>
            </select>
        </div>

        <div id="song-list-container"></div>
    </div>

    <footer style="position:fixed; bottom:0; left:0; width:100%; background:rgba(18,18,18,0.98); border-top:2px solid #1db954; padding:20px; box-sizing:border-box;">
        <div style="max-width:550px; margin:auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <p id="playing-now" style="color:#1db954; font-weight:bold; margin:0; font-size:14px;">Stopped</p>
                <button onclick="playNextSong()" style="background:#1db954; color:#000; border:none; padding:5px 15px; border-radius:20px; font-weight:bold; cursor:pointer;">NEXT ⏭️</button>
            </div>
            
            <div id="player-wrapper" style="background:#000; border-radius:10px; height:80px; border:1px solid #333;">
                <div style="color:#333; text-align:center; padding-top:30px;">Select Track</div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
