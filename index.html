<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganwa-Ho-Ganwa Ultra</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <h1>🎶 Ganwa-Ho-Ganwa Ultra</h1>

        <div class="input-card">
            <h3>📁 My Playlists</h3>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <input type="text" id="newPlaylistInput" placeholder="New Playlist Name...">
                <button onclick="createNewPlaylist()">Create & Save</button>
            </div>
            
            <label>Select Playlist View:</label>
            <select id="playlistSelect" onchange="loadSongs()" style="width:100%; padding:10px; background:#282828; color:white; border-radius:5px; margin-top:5px;">
                <option value="ALL_SONGS">✨ All Songs (Everything)</option>
                <option value="Default">Default</option>
            </select>
        </div>

        <div class="input-card">
            <h3>➕ Add Song</h3>
            <p style="font-size:12px; color:#1db954;">Adding to: <b id="targetDisplayName">Default</b></p>
            <input type="text" id="songName" placeholder="Song Name">
            <input type="text" id="songUrl" placeholder="Google Drive Link">
            <button onclick="addSong()" style="background:#1db954; width:100%; margin-top:10px;">Add Song</button>
        </div>

        <div class="playlist-section">
            <ul id="playlist"></ul>
        </div>

        <div class="player-footer">
            <p id="playing-now">Select a song</p>
            <div id="drive-player-wrapper"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
