<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganwa Player Pro</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #000; color: white; font-family: sans-serif; margin: 0; padding-bottom: 200px; }
        .container { max-width: 500px; margin: auto; padding: 15px; }
        
        /* Playlist & Input Cards */
        .card { background: #121212; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #282828; }
        select, input { width: 100%; padding: 12px; margin: 5px 0; background: #282828; color: #fff; border: none; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn-add { background: #1db954; color: #000; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 25px; cursor: pointer; margin-top: 10px; }

        /* Song List Item */
        .song-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #181818; 
            padding: 15px; 
            margin-bottom: 10px; 
            border-radius: 10px; 
            border-left: 5px solid #1db954;
        }
        .song-info { flex: 1; cursor: pointer; }
        .song-info b { font-size: 16px; color: #fff; }
        .song-info small { color: #1db954; }

        /* DELETE BUTTON - Explicitly Visible */
        .del-btn { 
            background: #ff4444; 
            color: white; 
            border: none; 
            padding: 10px 15px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-left: 10px;
            font-size: 12px;
            min-width: 70px;
        }

        footer { position: fixed; bottom: 0; width: 100%; background: #111; border-top: 2px solid #1db954; padding: 20px; box-sizing: border-box; text-align: center; }
        #status { color: #1db954; font-weight: bold; margin-bottom: 10px; display: block; }
        audio { width: 100%; height: 40px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: #1db954; text-align: center;">🎶 Ganwa Player</h1>

    <div class="card">
        <select id="playlistSelect" onchange="loadSongs()"></select>
    </div>

    <div class="card">
        <input type="text" id="songName" placeholder="Song Name">
        <input type="text" id="songUrl" placeholder="Google Drive Link">
        <button class="btn-add" onclick="addSong()">➕ ADD SONG</button>
    </div>

    <div id="songsList"></div>
</div>

<footer>
    <span id="status">Select a song...</span>
    <audio id="mainAudio" controls autoplay onended="playNext()"></audio>
</footer>

<script src="script.js"></script>
</body>
</html>
