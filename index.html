<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganwa Player Fixed</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body style="background:#000; color:#fff; font-family:sans-serif; margin:0; padding-bottom:200px;">

    <div class="container" style="max-width:500px; margin:auto; padding:15px;">
        <h1 style="text-align:center; color:#1db954;">🎶 Ganwa Player</h1>

        <div style="background:#181818; padding:15px; border-radius:10px; margin-bottom:15px;">
            <select id="playlistSelect" onchange="onPlaylistChange()" style="width:100%; padding:10px; background:#333; color:#fff; border:none; border-radius:5px;">
                <option value="ALL_SONGS">✨ All Songs</option>
            </select>
        </div>

        <div style="background:#181818; padding:15px; border-radius:10px; margin-bottom:20px;">
            <input type="text" id="songName" placeholder="Song Name" style="width:92%; padding:10px; margin-bottom:10px; background:#282828; color:#fff; border:none; border-radius:5px;">
            <input type="text" id="songUrl" placeholder="Paste Drive Link Here" style="width:92%; padding:10px; margin-bottom:10px; background:#282828; color:#fff; border:none; border-radius:5px;">
            <button onclick="addSong()" style="width:100%; padding:12px; background:#1db954; color:#000; font-weight:bold; border:none; border-radius:5px; cursor:pointer;">➕ ADD SONG</button>
        </div>

        <div id="playlist-list"></div>
    </div>

    <footer style="position:fixed; bottom:0; left:0; width:100%; background:#111; border-top:2px solid #1db954; padding:15px; box-sizing:border-box; z-index:999;">
        <div style="max-width:500px; margin:auto; text-align:center;">
            <p id="playing-now" style="color:#1db954; font-weight:bold; margin-bottom:10px; font-size:14px;">Select a song</p>
            
            <div id="iframe-holder" style="height:60px; background:#222; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#666;">
                Player Ready
            </div>

            <button onclick="playNextSong()" style="margin-top:10px; background:#333; color:#fff; border:1px solid #1db954; padding:8px 20px; border-radius:20px; cursor:pointer;">Next ⏭️</button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
