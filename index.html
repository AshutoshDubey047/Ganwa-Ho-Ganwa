<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganwa Player Fixed</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <div class="container" style="padding-bottom: 220px;">
        <header><h1>🎶 Ganwa-Ho-Ganwa Ultra</h1></header>

        <div class="input-card">
            <h3>📁 My Playlists</h3>
            <div style="display:flex; gap:10px;">
                <input type="text" id="newPlaylistInput" placeholder="New Playlist Name...">
                <button onclick="createNewPlaylist()" style="background:#fff; color:#000; font-weight:bold; padding:10px 15px; border-radius:8px;">Create & Save</button>
            </div>
            <p style="margin-top:10px; font-size:14px; color:#888;">Select Playlist View:</p>
            <select id="playlistSelect" onchange="onPlaylistChange()" style="width:100%; padding:12px; background:#181818; color:white; border-radius:8px; border:1px solid #333;">
                </select>
            <button onclick="deleteFullPlaylist()" style="background:#ff4444; color:white; width:100%; margin-top:10px; border:none; padding:10px; border-radius:8px; font-size:12px; cursor:pointer;">🗑️ Delete Selected Playlist</button>
        </div>

        <div class="input-card">
            <h3>➕ Add Song</h3>
            <p style="font-size:12px; color:#1db954;">Adding to: <b id="targetDisplayName">All Songs</b></p>
            <input type="text" id="songName" placeholder="Song Name">
            <input type="text" id="songUrl" placeholder="Google Drive Link">
            <button onclick="addSong()" style="background:#1db954; color:black; width:100%; font-weight:bold; padding:15px; border-radius:10px; border:none; margin-top:10px; cursor:pointer;">Add Song</button>
        </div>

        <div id="playlist"></div>

        <footer style="position:fixed; bottom:0; left:0; width:100%; background:#000; border-top:2px solid #1db954; padding:15px; z-index:9999;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; max-width:800px; margin-left:auto; margin-right:auto;">
                <p id="playing-now" style="color:#1db954; font-weight:bold; margin:0; font-size:14px;">Select a song to play</p>
                <button onclick="playNextSong()" style="background:#333; color:white; border:1px solid #1db954; padding:5px 15px; border-radius:5px; cursor:pointer;">NEXT ⏭️</button>
            </div>
            <div id="player-frame-container" style="max-width:800px; margin:0 auto;">
                <div style="height:80px; background:#121212; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#444; border:1px dashed #333; font-size:14px;">Player Ready - Click Play on a Song</div>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
