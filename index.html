<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganwa Player Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body style="background:#000; color:#fff; font-family:sans-serif; margin:0; padding-bottom:180px;">

    <div class="container" style="max-width:500px; margin:auto; padding:20px;">
        <header style="text-align:center; padding:20px 0;">
            <h1 style="color:#1db954; margin:0;">🎶 Ganwa Player</h1>
            <p style="color:#888; font-size:12px;">Cloud Music System</p>
        </header>

        <div style="background:#181818; padding:15px; border-radius:12px; margin-bottom:20px;">
            <label style="font-size:12px; color:#888;">SELECT PLAYLIST</label>
            <select id="playlistSelect" onchange="onPlaylistChange()" style="width:100%; padding:12px; margin-top:8px; background:#282828; color:#fff; border:1px solid #333; border-radius:8px;">
                <option value="ALL_SONGS">✨ All Songs</option>
            </select>
        </div>

        <div style="background:#181818; padding:15px; border-radius:12px; margin-bottom:20px;">
            <input type="text" id="songName" placeholder="Song Name" style="width:100%; padding:12px; margin-bottom:10px; background:#282828; border:none; color:#fff; border-radius:8px; box-sizing:border-box;">
            <input type="text" id="songUrl" placeholder="Google Drive Link" style="width:100%; padding:12px; margin-bottom:10px; background:#282828; border:none; color:#fff; border-radius:8px; box-sizing:border-box;">
            <button onclick="addSong()" style="width:100%; padding:12px; background:#1db954; color:#000; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">➕ ADD TO CLOUD</button>
        </div>

        <div id="playlist-container"></div>
    </div>

    <footer style="position:fixed; bottom:0; left:0; width:100%; background:#121212; border-top:2px solid #1db954; padding:20px; box-sizing:border-box; text-align:center; z-index:1000;">
        <div style="max-width:500px; margin:auto;">
            <p id="playing-now" style="color:#1db954; font-weight:bold; margin:0 0 10px 0; font-size:14px;">Select a song</p>
            
            <audio id="mainAudio" controls autoplay style="width:100%; height:40px; filter:invert(100%);">
                Your browser does not support audio.
            </audio>

            <div style="margin-top:10px; display:flex; justify-content:center; gap:20px;">
                <button onclick="playNextSong()" style="background:#333; color:#fff; border:1px solid #1db954; padding:8px 20px; border-radius:20px; cursor:pointer; font-weight:bold;">NEXT ⏭️</button>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
