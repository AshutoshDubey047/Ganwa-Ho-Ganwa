<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganwa-Ho-Ganwa | Google Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎶 Ganwa-Ho-Ganwa</h1>
            
            <div id="auth-section">
                <button id="loginBtn" onclick="googleLogin()">Login with Google</button>
                <div id="user-info" style="display:none;">
                    <p>Welcome, <span id="userName"></span>!</p>
                    <button onclick="googleLogout()">Logout</button>
                </div>
            </div>

            <div id="upload-card" class="input-card" style="display:none; margin-top:20px;">
                <input type="text" id="songName" placeholder="Gaane ka naam...">
                <input type="text" id="songUrl" placeholder="Drive Link...">
                <button onclick="addSong()">Add Song</button>
            </div>
        </header>

        <ul id="playlist"></ul>

        <footer class="player">
            <p id="playing-now">Select a song</p>
            <audio id="main-player" controls crossorigin="anonymous"></audio>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
